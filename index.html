<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Agency | Intelligent Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #6366f1; 
            --accent: #ff3b30; 
            --dark-bg: #000000;
            --glass: rgba(15, 15, 15, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .swirl-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(120px);
            opacity: 0.25;
            z-index: -1;
        }

        .hero { 
            text-align: center; 
            z-index: 1; 
            max-width: 900px; 
            padding: 60px 20px 30px 20px;
        }
        .hero h1 { 
            font-size: 3.2rem; 
            font-weight: 800; 
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        /* --- VIDEO PLAYER FIX --- */
        .video-container {
            width: 90%;
            max-width: 750px;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            background: #0a0a0a;
            margin-bottom: 40px;
            z-index: 1;
        }
        video { width: 100%; display: block; background: black; }

        /* Floating Chat UI */
        #chat-trigger {
            position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px;
            background: white; border-radius: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 15px 45px rgba(99, 102, 241, 0.2);
            z-index: 1000;
        }

        #chat-window {
            position: fixed; bottom: 110px; right: 30px; width: 380px; height: 550px;
            max-height: 70vh;
            background: var(--glass); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .chat-header { 
            padding: 20px 25px; background: rgba(255, 255, 255, 0.05); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 800; color: #34c759; }
        .dot { width: 8px; height: 8px; background: #34c759; border-radius: 50%; }

        #chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 14px 18px; border-radius: 20px; font-size: 0.9rem; line-height: 1.5; max-width: 85%; }
        .bot { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: white; color: black; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }

        /* --- LOADER FIX (VISIBLE) --- */
        .loader { 
            font-size: 0.8rem; 
            color: #ffffff; 
            display: none; 
            margin: 0 0 10px 25px; 
            font-weight: 600; 
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .chat-input { padding: 20px; background: rgba(0,0,0,0.4); display: flex; gap: 10px; }
        input { 
            flex: 1; border: 1px solid rgba(255,255,255,0.1); padding: 14px; 
            background: rgba(255,255,255,0.05); border-radius: 15px; outline: none; color: white;
        }
        
        #send-btn { 
            background: white; color: black; border: none; padding: 0 20px; 
            border-radius: 15px; cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div class="swirl-bg"></div>

    <div class="hero">
        <h1>An independent boutique agency rooted in Italy, powered in UK and globally.</h1>
        <p style="color: #999; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem;">Digital Excellence // Client Concierge</p>
    </div>

    <!-- Video Demonstration -->
    <div class="video-container">
        <video controls>
            <source src="https://github.com/Muneeb20019/Sales-AI-Agent-n8n/raw/main/anon_20260126_083506%20(1).webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
    </div>

    <div id="chat-trigger" onclick="toggleChat()">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <span style="font-weight: 800; letter-spacing: 1.5px; font-size: 0.7rem; color: #fff;">ASSISTANT</span>
            <div class="status"><div class="dot"></div> Online</div>
        </div>
        <div id="chat-content">
            <div class="msg bot">Hi there! It’s great to meet you. I’m here to help you learn more about our boutique agency. How can I assist you today?</div>
        </div>
        <!-- Loader is now White and clearly visible -->
        <div id="loader" class="loader">Assistant is writing...</div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="How can we help?">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const CHAT_URL = "https://muneebkhan6.app.n8n.cloud/webhook/213f3e48-d88c-4674-91bf-4eb1e6cf28d2";
        const POLL_URL = "https://muneebkhan6.app.n8n.cloud/webhook/020fa3d1-d00d-4563-9eac-de788fd3cf77";
        const session_id = "user_" + Math.random().toString(36).substr(2, 9);
        let lastMessageId = null;

        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        async function send() {
            const input = document.getElementById('user-input');
            const content = document.getElementById('chat-content');
            const loader = document.getElementById('loader');
            const text = input.value.trim();
            if(!text) return;

            content.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            content.scrollTop = content.scrollHeight;
            
            // SHOW THE LOADER
            loader.style.display = 'block';

            try {
                const res = await fetch(CHAT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id, message: text })
                });
                const data = await res.json();
                
                // HIDE THE LOADER
                loader.style.display = 'none';

                if (data.output) {
                    const botMsg = data.output.replace(/\n/g, '<br>');
                    content.innerHTML += `<div class="msg bot">${botMsg}</div>`;
                }
                content.scrollTop = content.scrollHeight;
            } catch (e) {
                loader.style.display = 'none';
                content.innerHTML += `<div class="msg bot">System offline. Ensure n8n is Active.</div>`;
            }
        }

        async function listenForStaff() {
            try {
                const res = await fetch(POLL_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: session_id })
                });
                const data = await res.json();
                if (data.output && data.message_id !== lastMessageId) {
                    lastMessageId = data.message_id;
                    const content = document.getElementById('chat-content');
                    content.innerHTML += `<div class="msg bot" style="border-left: 4px solid #6366f1; background: rgba(99, 102, 241, 0.1);"><small style="color: #6366f1; font-weight: 800; font-size: 0.6rem;">STAFF REPLY</small><br>${data.output}</div>`;
                    content.scrollTop = content.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(listenForStaff, 4000);
        document.getElementById('send-btn').addEventListener('click', send);
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
