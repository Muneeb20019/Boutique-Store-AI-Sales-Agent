<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figmenta AI | Intelligent Agent Hub</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #ff3b30; 
            --glass: rgba(255, 255, 255, 0.85);
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #ffffff, #f2f2f7);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-section {
            text-align: center;
            padding: 40px;
            animation: fadeIn 1.2s ease-out;
            z-index: 1;
        }

        h1 { font-size: 5rem; font-weight: 800; letter-spacing: -3px; margin: 0; color: var(--primary); }
        p { font-size: 1.2rem; color: #666; margin-top: 15px; max-width: 550px; line-height: 1.6; }

        /* Floating Chat Widget */
        #chat-widget {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 9999;
        }

        #chat-trigger {
            width: 70px; height: 70px;
            background: var(--primary);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #chat-trigger:hover { transform: translateY(-5px) rotate(5deg); background: var(--accent); }

        #chat-container {
            position: fixed;
            bottom: 120px;
            right: 40px;
            width: 420px;
            height: 680px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chat-header {
            padding: 25px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot { width: 10px; height: 10px; background: #34c759; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #34c759; }

        #chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            padding: 15px 20px;
            border-radius: 22px;
            font-size: 0.95rem;
            max-width: 85%;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .bot { background: white; color: var(--primary); align-self: flex-start; border-bottom-left-radius: 5px; }
        .user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 5px; }

        .input-area {
            padding: 25px;
            background: white;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        input {
            flex: 1;
            border: none;
            padding: 16px 22px;
            background: #f4f4f7;
            border-radius: 18px;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
        }

        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn:hover { background: var(--accent); transform: scale(1.05); }

        .typing { font-size: 0.8rem; color: #999; margin: 0 0 15px 25px; display: none; font-style: italic; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1>Figmenta.</h1>
        <p>Boutique Digital Agency in Milan. <br> Powered by Fig1 Intelligent Automation.</p>
    </div>

    <div id="chat-widget">
        <div id="chat-container">
            <div class="chat-header">
                <div>
                    <span class="status-dot"></span>
                    <span style="font-weight: 600; letter-spacing: 0.5px;">Fig1 Assistant</span>
                </div>
                <span style="opacity: 0.6; font-size: 0.75rem; text-transform: uppercase; font-weight: 800;">Secure Node</span>
            </div>
            <div id="chat-messages">
                <div class="msg bot">Hello! I am <b>Fig1</b>, Figmenta's AI. How can I help you discover our digital expertise today?</div>
            </div>
            <div id="typing" class="typing">Fig1 is analyzing...</div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your inquiry...">
                <button id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

        <div id="chat-trigger" onclick="toggleChat()">
            <svg id="icon-chat" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
    </div>

    <script>
        // YOUR PRODUCTION URL
        const WEBHOOK_URL = "https://muneebkhan6.app.n8n.cloud/webhook/213f3e48-d88c-4674-91bf-4eb1e6cf28d2";
        const session_id = "fig_" + Math.random().toString(36).substr(2, 9);

        function toggleChat() {
            const container = document.getElementById('chat-container');
            container.style.display = (container.style.display === 'flex') ? 'none' : 'flex';
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            const typing = document.getElementById('typing');
            const text = input.value.trim();

            if (!text) return;

            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
            typing.style.display = 'block';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id, message: text })
                });

                const data = await response.json();
                typing.style.display = 'none';
                
                // Uses the 'output' field from your Python node
                if (data.output) {
                    const cleanOutput = data.output.replace(/\n/g, '<br>');
                    messages.innerHTML += `<div class="msg bot">${cleanOutput}</div>`;
                } else {
                    messages.innerHTML += `<div class="msg bot">I received your data, but my internal logic is still processing. Please try again.</div>`;
                }
                messages.scrollTop = messages.scrollHeight;

            } catch (err) {
                typing.style.display = 'none';
                messages.innerHTML += `<div class="msg bot"><b>System Offline:</b> Please ensure the n8n workflow is toggled to "ACTIVE" in the dashboard.</div>`;
            }
        }

        document.getElementById('send-btn').addEventListener('click', handleSend);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
