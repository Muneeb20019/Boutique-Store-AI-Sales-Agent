<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figmenta | Boutique AI Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #6366f1; /* Boutique Purple */
            --accent: #ff3b30; /* Electric Red */
            --dark-bg: #000000;
            --glass: rgba(15, 15, 15, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--dark-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        /* Animated Boutique Swirl (Matching your screenshot) */
        .swirl-bg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(120px);
            opacity: 0.4;
            z-index: 0;
            animation: moveSwirl 10s infinite alternate;
        }

        @keyframes moveSwirl {
            from { transform: translate(-60%, -40%) scale(1); }
            to { transform: translate(-40%, -60%) scale(1.2); }
        }

        .hero { 
            text-align: center; 
            z-index: 1; 
            max-width: 900px; 
            padding: 0 40px;
            animation: fadeIn 1.5s ease-out;
        }
        .hero h1 { 
            font-size: 3.5rem; 
            font-weight: 800; 
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        .hero p { 
            color: #888; 
            font-size: 1.1rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Floating Chat UI */
        #chat-trigger {
            position: fixed; bottom: 40px; right: 40px; width: 75px; height: 75px;
            background: white; border-radius: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        #chat-trigger:hover { transform: scale(1.1) rotate(5deg); background: var(--primary-glow); }
        #chat-trigger svg { stroke: black; transition: stroke 0.3s; }
        #chat-trigger:hover svg { stroke: white; }

        #chat-window {
            position: fixed; bottom: 130px; right: 40px; width: 420px; height: 580px;
            max-height: 75vh;
            background: var(--glass); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            z-index: 1000;
            animation: slideUp 0.5s ease-out;
        }

        .chat-header { 
            padding: 25px; background: rgba(255, 255, 255, 0.03); 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 800; color: #34c759; }
        .dot { width: 8px; height: 8px; background: #34c759; border-radius: 50%; box-shadow: 0 0 10px #34c759; }

        #chat-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 16px 20px; border-radius: 22px; font-size: 0.95rem; line-height: 1.6; max-width: 85%; }
        .bot { background: rgba(255,255,255,0.07); color: #ddd; align-self: flex-start; border-bottom-left-radius: 5px; }
        .user { background: white; color: black; align-self: flex-end; border-bottom-right-radius: 5px; font-weight: 600; }

        .chat-input { padding: 25px; background: rgba(255,255,255,0.02); display: flex; gap: 12px; }
        input { 
            flex: 1; border: 1px solid rgba(255,255,255,0.1); padding: 16px; 
            background: rgba(255,255,255,0.05); border-radius: 18px; outline: none; color: white;
        }
        
        #send-btn { 
            background: white; color: black; border: none; padding: 0 25px; 
            border-radius: 18px; cursor: pointer; font-weight: 800;
        }
        #send-btn:hover { background: var(--primary-glow); color: white; }

        .loader { font-size: 0.7rem; color: var(--primary-glow); display: none; margin: 0 0 10px 30px; font-weight: 700; letter-spacing: 1px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar Styling */
        #chat-content::-webkit-scrollbar { width: 3px; }
        #chat-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="swirl-bg"></div>

    <div class="hero">
        <h1>Figmenta is an independent boutique agency rooted in Italy, powered in UK and globally.</h1>
        <p>Intelligent Agent Hub // Assistant</p>
    </div>

    <div id="chat-trigger" onclick="toggleChat()">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <span style="font-weight: 800; letter-spacing: 2px; font-size: 0.8rem; color: var(--primary-glow);">ASSISTANT</span>
            <div class="status"><div class="dot"></div> ONLINE</div>
        </div>
        <div id="chat-content">
            <div class="msg bot">Hi there! 👋 I’m here to help you explore what Figmenta can do for you. Whether it’s strategy, design, or tech — just ask away!</div>
        </div>
        <div id="loader" class="loader">ASSISTANT IS PROCESSING...</div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button id="send-btn">SEND</button>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://muneebkhan6.app.n8n.cloud/webhook/213f3e48-d88c-4674-91bf-4eb1e6cf28d2";
        const session_id = "fig_boutique_" + Math.random().toString(36).substr(2, 9);

        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        async function send() {
            const input = document.getElementById('user-input');
            const content = document.getElementById('chat-content');
            const loader = document.getElementById('loader');
            const text = input.value.trim();
            if(!text) return;

            content.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            content.scrollTop = content.scrollHeight;
            loader.style.display = 'block';

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id, message: text })
                });
                const data = await res.json();
                loader.style.display = 'none';
                
                const botMsg = data.output.replace(/\n/g, '<br>');
                content.innerHTML += `<div class="msg bot">${botMsg}</div>`;
                content.scrollTop = content.scrollHeight;
            } catch (e) {
                loader.style.display = 'none';
                content.innerHTML += `<div class="msg bot">Connection Error. Ensure n8n is ACTIVE.</div>`;
            }
        }

        document.getElementById('send-btn').addEventListener('click', send);
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
